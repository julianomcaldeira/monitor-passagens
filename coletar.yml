name: coletar
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python coletor.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
